<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <meta name="description" content="EarnFlow is a polished Telegram earning platform demonstration.">
  <title>EarnFlow — Earn. Complete. Refer.</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#home" data-nav="home" aria-label="EarnFlow home"><span class="brand-mark"><i data-lucide="sparkles"></i></span><span>EarnFlow</span></a>
      <div class="top-actions"><button class="icon-button" data-action="notifications" aria-label="Open notifications"><i data-lucide="bell"></i><span class="badge">3</span></button><div class="top-avatar">DU</div></div>
    </header>
    <main id="app" class="main-content" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="Primary navigation">
      <a href="#home" data-nav="home"><i data-lucide="layout-dashboard"></i><span>Home</span></a>
      <a href="#tasks" data-nav="tasks"><i data-lucide="list-checks"></i><span>Tasks</span></a>
      <a href="#referrals" data-nav="referrals"><i data-lucide="users-round"></i><span>Refer</span></a>
      <a href="#wallet" data-nav="wallet"><i data-lucide="wallet-cards"></i><span>Wallet</span></a>
      <a href="#profile" data-nav="profile"><i data-lucide="circle-user-round"></i><span>Profile</span></a>
    </nav>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>
  <script src="app.js"></script>
</body>
</html>
